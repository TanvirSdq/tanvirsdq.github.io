<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanvir Siddique | Projects &amp; Systems Archive</title>
<meta name="description" content="Complete projects archive of Tanvir Siddique — all real projects from GitHub.">

<script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,900;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

<header class="subpage-header">
  <a class="back-link" href="./">
    <span aria-hidden="true">&#8592;</span> Tanvir Siddique
  </a>
  <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle color theme" style="position:static;">
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"></circle>
      <path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path>
    </svg>
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"></path>
    </svg>
  </button>
</header>

<main class="subpage-wrap">
  <header class="sop-header">
    <div class="sop-meta" id="archive-meta">Projects &bull; Archive</div>
    <h1 class="sop-title">Projects &amp; Systems Archive</h1>
    <p class="sop-subtitle">All real projects — filterable by category.</p>
  </header>

  <!-- Filter buttons injected here -->
  <nav class="filter-bar" id="filter-bar" aria-label="Project category filters">
    <button type="button" class="filter-btn is-active" data-filter="all">All Projects</button>
  </nav>

  <!-- Project cards injected here -->
  <div class="projects" id="projects-grid">
    <p style="color: var(--text-secondary); font-family: var(--font-mono); font-size: 13px;">Loading projects…</p>
  </div>

  <div style="margin-top: 56px; text-align: center;">
    <a class="cta-link-btn" href="./">
      <span aria-hidden="true">&#8592;</span> Return to Main Overview
    </a>
  </div>
</main>

<footer class="site-footer" id="archive-footer">
  <div class="site-footer__group">
    <span>Projects Archive</span>
  </div>
  <div class="site-footer__group">
    <span>&copy; <script>document.write(new Date().getFullYear())</script> Tanvir Siddique</span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script>
(function () {
  /* ── Theme toggle ── */
  const themeBtn = document.getElementById("theme-toggle");
  if (themeBtn) {
    themeBtn.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme") || "light";
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  }

  function esc(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ── Render ── */
  function render(data) {
    const projects = data.projects || [];
    if (!projects.length) {
      document.getElementById("projects-grid").innerHTML =
        "<p style=\"color:var(--text-secondary)\">No projects found in data.yaml.</p>";
      return;
    }

    /* Collect unique categories in the order they first appear */
    const categories = [];
    projects.forEach(p => {
      if (p.category && !categories.includes(p.category)) categories.push(p.category);
    });

    /* Build filter buttons */
    const filterBar = document.getElementById("filter-bar");
    filterBar.innerHTML = "";
    const allBtn = document.createElement("button");
    allBtn.type = "button";
    allBtn.className = "filter-btn is-active";
    allBtn.dataset.filter = "all";
    allBtn.textContent = "All Projects";
    filterBar.appendChild(allBtn);

    categories.forEach(cat => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "filter-btn";
      btn.dataset.filter = cat;
      btn.textContent = cat;
      filterBar.appendChild(btn);
    });

    /* Update meta line with category labels */
    const metaEl = document.getElementById("archive-meta");
    if (metaEl) metaEl.textContent = categories.join(" \u2022 ");

    /* Build project cards */
    const grid = document.getElementById("projects-grid");
    grid.innerHTML = "";

    projects.forEach(p => {
      const card = document.createElement("article");
      card.className = "project-card";
      card.dataset.category = p.category || "";

      const tags = (p.tags || []).map((t, i) =>
        `<span class="badge${i === 0 ? " badge--accent" : ""}">${esc(t)}</span>`
      ).join("");

      const links = [];
      if (p.github) links.push(
        `<a class="project-card__link" href="${esc(p.github)}" target="_blank" rel="noopener noreferrer">View on GitHub <span aria-hidden="true">&#8599;</span></a>`
      );
      if (p.demo || p.streamlit) links.push(
        `<a class="project-card__link" href="${esc(p.demo || p.streamlit)}" target="_blank" rel="noopener noreferrer">Live Demo <span aria-hidden="true">&#8599;</span></a>`
      );

      /* Featured badge in title area */
      const featuredBadge = p.featured
        ? `<span class="badge badge--accent" style="margin-left:8px;font-size:10px;vertical-align:middle;">Featured</span>`
        : "";

      card.innerHTML = `
        <div class="project-card__tags">${tags}</div>
        <h2 class="project-card__title">${esc(p.title)}${featuredBadge}</h2>
        <p class="project-card__desc">${esc(p.description)}</p>
        <div style="display:flex;flex-direction:column;width:100%;">${links.join("")}</div>
      `;
      grid.appendChild(card);
    });

    /* Wire up filter buttons */
    const allCards = grid.querySelectorAll(".project-card");
    const allBtns = filterBar.querySelectorAll(".filter-btn");

    allBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        allBtns.forEach(b => b.classList.remove("is-active"));
        btn.classList.add("is-active");
        const filter = btn.dataset.filter;
        allCards.forEach(card => {
          card.style.display =
            (filter === "all" || card.dataset.category === filter) ? "flex" : "none";
        });
      });
    });
  }

  /* ── Fetch data.yaml ── */
  fetch("data.yaml", { cache: "no-store" })
    .then(res => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(text => {
      const data = jsyaml.load(text);
      render(data);
    })
    .catch(err => {
      document.getElementById("projects-grid").innerHTML =
        `<p style="color:var(--accent-color);font-family:var(--font-mono)">Could not load data.yaml: ${esc(err.message)}</p>`;
    });
})();
</script>

</body>
</html>
